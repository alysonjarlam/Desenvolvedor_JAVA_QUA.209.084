<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Máscara de Entrada</title>
</head>
<body>
    <h1>Máscara de Entrada</h1>
    <form method="">
        <label for="nome">Nome</label><br>
        <input type="text" id="nome" required><br><br>
        <label for="cpf">Cpf</label><br>
        <input type="text" id="CPF" maxlength="11" required><br><br>
        <label for="telefone">Telefone</label><br><br>
        <input type="tel" id="teledone" required><br><br>
        <label for="cep">Cep</label><br>
        <input type="text" id="cep" required><br><br>
        <button type="submit">Enviar</button>
    
    </form>
    <h3 id="result"></h3>

    <script src="js/script.js"></script>
</body>
</html>

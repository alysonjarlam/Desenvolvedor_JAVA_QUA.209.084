    <main>
        <div class="container">
            <h1>Formulário Bootstrap</h1>            
            <!--Formulario-->
            <form method="">
                <div class="row">
                    <div class="col-12 col-md-6 col-lg-4 mb-3">
                    <label for="nome" class="form-label">Primeiro nome:</label>
                    <input class="form-control" type="text" placeholder="Informe o primeiro nome" aria-label="Informe o primeiro nome">
                    </div>
                </div>

                 <div class="col-12 col-md-6 col-lg-8 mb-3">
                    <label for="Sobrenome" class="form-label">Sobrenome:</label>
                    <input class="form-control" type="text" placeholder="Informe o Sobrenome" aria-label="Sobrenome">
                </div> 

                <div class="col-12 col-md-4 col-lg-3 mb-3">
                    <label for="cpf" class="form-label">CPF: :</label>
                    <input class="form-control" type="text" placeholder="xxx.xxx.xxx-xx" aria-label="cpf">
                </div> 

                <div class="col-12 col-md-4 col-lg-3 mb-3">
                    <label for="cpf" class="form-label">Telefone: :</label>
                    <input class="form-control" type="tel" placeholder="(ddd) 9xxxx.xxxx" aria-label="telefone">
                </div> 

                <div class="col-12 col-md-4 col-lg-3 mb-3">
                    <label for="data de nascimento" class="form-label">Data de Nascimento: </label>
                    <input class="form-control" type="date"  aria-label="data de nascimento">
                </div> 
                <div class="col-12 col-md-4 col-lg-3 mb-3">
                    <label for="genero" class="form-label">Genero:</label>
                    <select= class="form-select"  aria-label="genero">

                        <option value="1">Masculino</option>
                        <option value="2">Feminino</option>
                        <option value="3">Outro</option>
                    </select>

                </div> 
                <div class="d-flex justify-contente-center mt-5">
                    <button type="submmit" class="btn btn-sucess">Enviar</button>
                </div> 
                </form>

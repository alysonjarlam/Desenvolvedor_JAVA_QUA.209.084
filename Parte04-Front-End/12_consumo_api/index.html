<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Bootstrap demo</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>


    <body>
                <div class="container mt-5">
                    <h1>Formulario com API</h1>
                    <hr>
                    <form method="" class="mt-5">
                        <div class="row">
                            <div class="col-12 compmd-6 mb-3">
                                <label for="Nomw" class="form-label">Nome</label>
                                <input type="text" class="form-control" id="nome" required>
                            </div>

                            <div class="col-12 compmd-6 mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>

                            <div class="col-12 compmd-4 mb-3">
                                <label for="cpf" class="form-label">CPF</label>
                                <input type="text" class="form-control" id="cpf" required>
                            </div>

                            <div class="col-12 compmd-4 mb-3">
                                <label for="Telefone" class="form-label">Telefone</label>
                                <input type="tel" class="form-control" id="telefone" required>
                            </div>

                            <div class="col-12 compmd-4 mb-3">
                                <label for="Cep" class="form-label">Cep</label>
                                <input type="text" class="form-control" id="cep" required>
                            </div>

                            <div class="col-12 compmd-4 col-lo-3 mb-3">
                                <label for="Estado" class="form-label">Estado</label>
                                <input type="text" class="form-control" id="estado" required>
                            </div>

                            <div class="col-12 compmd-4 col-lo-3 mb-3">
                                <label for="cidade" class="form-label">Cidade</label>
                                <input type="text" class="form-control" id="cidade" required>
                            </div>
                            
                            <div class="col-12 col-md-8 col-lo-3 mb-3">
                                <label for="Logradouro" class="form-label">Logradouro</label>
                                <input type="text" class="form-control" id="Logradouro" required>
                            </div>

                            <div class="col-12 col-md-4 col-lo-3 mb-3">
                                <label for="Numero" class="form-label">Numero</label>
                                <input type="text" class="form-control" id="numero" required>
                            </div>

                            <div class="col-12 col-lg-9 col-lo-3 mb-3">
                                <label for="Complemento" class="form-label">Complemento</label>
                                <input type="text" class="form-control" id="Complemento">
                            </div>

                            <div class="d-flex justify-content-end mt-5">
                                <button type="submit" class="btn btn-primary">Enviar</button>
                            </div>                      

                        
                        </div>
                        
                    </form>
                    <h2 id="dados"></h2>
                </div>
    
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
                <script src="js/script.js"></script>
    </body>
</html>

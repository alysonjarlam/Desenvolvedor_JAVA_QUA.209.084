<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <main>
        <div class="container">
            <div class="row mt-5">
                <h1 id="imc">Cálculo do IMC</h1>
                <h2 id="diag">Calcule seu índice de massa corporal</h2>
                <form method="" class="mt-5">
                    <div class="col-12 col-md-6 col-lg-3 mb-3">
                        <label for="peso" class="form-label">Peso:</label>
                        <input type="number" step="0.01" placeholder="kg" class="form-control" id="peso" aria-label="peso">
                    </div>
                    <div class="col-12 col-md-6 col-lg-3 mb-3">
                        <label for="altura" class="form-label">Altura:</label>
                        <input type="number" step="0.01" placeholder="m" class="form-control" id="altura" aria-label="altura">
                    </div>
                    <div>
                        <button type="submit" class="btn btn-primary mt-5">Calcular</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/script.js"></script>
        
</body>
</html>

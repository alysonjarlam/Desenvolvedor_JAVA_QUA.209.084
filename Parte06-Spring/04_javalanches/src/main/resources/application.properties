spring.application.name=04_javalanches
# configção de conexão com o SGBD MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/db_java_lanches
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.driver

# configção do Hibernate
spring.jpa.show-sql=true
spring.jpa.proporties.Hibernate.formate_sql=true
spring.jpa.Hibernate.ddl-auto=update
spring.jpa.database-platform=org.Hibernate.dialect.MySQLDialect
